[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aip"
version = "3.0.0"
description = "A zero-config linter for web animation code. Catches memory leaks, jank, and accessibility violations."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
keywords = ["animation", "linter", "static-analysis", "accessibility", "a11y", "wcag", "gsap", "threejs", "css", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Abdullahmalik66/aip"
Issues = "https://github.com/Abdullahmalik66/aip/issues"

[project.scripts]
aip = "aip.cli:main"

[tool.setuptools]
packages = ["aip"]

[tool.setuptools.package-data]
aip = [
    "data/skills/*/*.md",
    "data/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
